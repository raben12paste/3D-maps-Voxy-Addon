plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = "Xaero's Maven"
		url = 'https://chocolateminecraft.com/maven'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"voxymap" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// A locally built Voxy jar (libs/voxy-*.jar) wins over the Modrinth artifact, for
// Voxy builds that are not published yet.
def localVoxyJars = fileTree("libs") { include "voxy-*.jar" }

// Minecraft 26.x ships deobfuscated, so Loom is used without mappings and
// without remapping: the names we compile against are the names at runtime.
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations, present at compile time only.
	if (localVoxyJars.isEmpty()) {
		clientCompileOnly "maven.modrinth:voxy:${project.voxy_version}"
	} else {
		clientCompileOnly localVoxyJars
	}
	clientCompileOnly "maven.modrinth:iris:${project.iris_version}"
	clientCompileOnly "xaero.map:xaeroworldmap-fabric-${project.minecraft_version}:${project.xaero_worldmap_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

// Kept so the historical `./gradlew officialRuntimeJar` command still works.
// Without remapping, the plain `jar` task already produces the runtime jar.
tasks.register("officialRuntimeJar") {
	dependsOn tasks.named("jar")
}
